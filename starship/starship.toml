# 关闭提示符上方的空行
add_newline = false

# 强制单行显示：将此项设为 true 即可取消换行
[line_break]
disabled = true

# 提示符开头：粉紫色用户名
[username]
format = "[$user]($style) "
style_user = "#E2A0D0"
show_always = true

# 路径显示：紫色调
[directory]
style = "purple"
truncate_to_repo = true
truncation_symbol = "…/"

# 电池状态：仅在低于 50% 时显示
[battery]
full_symbol = '🔋'
charging_symbol = '⚡️'
discharging_symbol = '💀'
format = '[$symbol$percentage]($style) '

[[battery.display]]
threshold = 15
style = 'bold red'

[[battery.display]]
threshold = 50
style = 'bold yellow'

# 命令耗时：灰色斜体
[cmd_duration]
format = '[took $duration](italic fg:gray) '

# Git 状态：极简图标
[git_branch]
symbol = " "
style = "bold purple"

[git_status]
format = '([\[$all_status\]]($style) )'
staged = '+$count'
modified = '📝$count'
deleted = '-$count'
untracked = '?$count'
stashed = '📦$count'

# 结尾符号：直接跟在路径或 Git 状态后面
[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
